<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This Year Wrapped</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      scroll-snap-type: y mandatory;
      background-color: #272727;
    }
    
    body {
      overflow-y: scroll;
      overscroll-behavior: none;
    }
    
    section {
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #272727;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      will-change: transform;
    }
    
    .loading {
      position: absolute;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <section data-video="Intro.mp4">
    <span class="loading">Loading...</span>
    <video muted playsinline preload="auto">
      <source src="Intro.mp4" type="video/mp4">
    </video>
  </section>

  <section data-video="page2.mp4">
    <video muted playsinline preload="auto">
      <source src="page2.mp4" type="video/mp4">
    </video>
  </section>

  <section data-video="page3.mp4">
    <video muted playsinline preload="auto">
      <source src="page3.mp4" type="video/mp4">
    </video>
  </section>

  <section data-video="page4.mp4">
    <video muted playsinline preload="auto">
      <source src="page4.mp4" type="video/mp4">
    </video>
  </section>

  <section data-video="page5.mp4">
    <video muted playsinline preload="auto">
      <source src="page5.mp4" type="video/mp4">
    </video>
  </section>

  <section data-video="page6.mp4">
    <video muted playsinline preload="auto">
      <source src="page6.mp4" type="video/mp4">
    </video>
  </section>

  <section data-video="page7.mp4">
    <video muted playsinline preload="auto">
      <source src="page7.mp4" type="video/mp4">
    </video>
  </section>

  <section data-video="page8.mp4">
    <video muted playsinline preload="auto">
      <source src="page8.mp4" type="video/mp4">
    </video>
  </section>

  <section data-video="page9.mp4">
    <video muted playsinline preload="auto">
      <source src="page9.mp4" type="video/mp4">
    </video>
  </section>

  <script>
    const sections = document.querySelectorAll('section');
    const config = {
      rootMargin: '0px',
      threshold: 0.5
    };

    // Use Intersection Observer for better performance
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        const loading = entry.target.querySelector('.loading');
        
        if (!video) return;

        if (entry.isIntersecting) {
          // Remove loading indicator
          if (loading) loading.style.display = 'none';
          
          // Reset and play video
          video.currentTime = 0;
          video.play().catch(err => console.log('Play failed:', err));
          
          // Auto-scroll setup
          setupAutoScroll(video, entry.target);
        } else {
          video.pause();
        }
      });
    }, config);

    // Observe all sections
    sections.forEach(section => observer.observe(section));

    // Auto-scroll to next section near video end
    function setupAutoScroll(video, currentSection) {
      let scrolled = false;
      
      const checkTime = () => {
        if (scrolled || !video.duration) return;
        
        const remaining = video.duration - video.currentTime;
        
        if (remaining <= 0.2 && remaining > 0) {
          scrolled = true;
          const currentIndex = Array.from(sections).indexOf(currentSection);
          const nextSection = sections[currentIndex + 1];
          
          if (nextSection) {
            nextSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          
          video.removeEventListener('timeupdate', checkTime);
        }
      };
      
      video.addEventListener('timeupdate', checkTime);
    }

    // Enable first video on load
    window.addEventListener('load', () => {
      const firstVideo = sections[0]?.querySelector('video');
      if (firstVideo) {
        const loading = sections[0].querySelector('.loading');
        if (loading) loading.style.display = 'none';
        firstVideo.play().catch(err => console.log('Autoplay blocked:', err));
      }
    });
  </script>
</body>
</html>
