<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This Year Wrapped</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-snap-type:y mandatory;background:#272727;scroll-behavior:smooth}
    body{overflow-y:scroll;overscroll-behavior-y:contain;font-family:system-ui,-apple-system,sans-serif}
    section{height:100vh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#272727}
    video{width:100%;height:100%;object-fit:contain;background:#272727}
    #startBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:24px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:50px;cursor:pointer;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .2s;-webkit-tap-highlight-color:transparent}
    #startBtn:hover{transform:translate(-50%,-50%) scale(1.05)}
    #startBtn:active{transform:translate(-50%,-50%) scale(.95)}
    .hidden{display:none!important}
    @media(max-width:768px){
      #startBtn{font-size:20px;padding:16px 32px}
    }
  </style>
</head>
<body>
  <button id="startBtn">Start Your Wrapped</button>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="Intro.mp4" type="video/mp4"></video></section>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="page2.mp4" type="video/mp4"></video></section>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="page3.mp4" type="video/mp4"></video></section>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="page4.mp4" type="video/mp4"></video></section>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="page5.mp4" type="video/mp4"></video></section>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="page6.mp4" type="video/mp4"></video></section>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="page7.mp4" type="video/mp4"></video></section>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="page8.mp4" type="video/mp4"></video></section>
  <section><video muted playsinline preload="auto" webkit-playsinline><source src="page9.mp4" type="video/mp4"></video></section>
  <script>
    if('scrollRestoration'in history)history.scrollRestoration='manual';
    window.scrollTo(0,0);
    
    const s=[...document.querySelectorAll('section')],b=document.getElementById('startBtn');
    let a=0,scrolling=0;
    
    // Intersection Observer with better mobile support
    const o=new IntersectionObserver(e=>{
      e.forEach(({target:t,isIntersecting:i})=>{
        const v=t.querySelector('video');
        if(!v||!a)return;
        
        if(i){
          v.currentTime=0;
          const playPromise=v.play();
          if(playPromise!==undefined){
            playPromise.catch(()=>{
              // Autoplay blocked - user needs to interact first
              setTimeout(()=>v.play().catch(()=>{}),100);
            });
          }
          
          let d=0;
          const c=()=>{
            if(d||!v.duration||v.duration-v.currentTime>0.2||scrolling)return;
            d=1;
            const x=s.indexOf(t);
            const next=s[x+1];
            if(next){
              scrolling=1;
              // Use scrollIntoView with better cross-browser support
              if('scrollIntoView'in next){
                next.scrollIntoView({behavior:'smooth',block:'start'});
              }else{
                // Fallback for older browsers
                next.scrollIntoView();
              }
              setTimeout(()=>scrolling=0,1000);
            }
            v.removeEventListener('timeupdate',c);
          };
          v.addEventListener('timeupdate',c);
        }else{
          v.pause();
        }
      });
    },{threshold:0.5,rootMargin:'0px'});
    
    s.forEach(x=>o.observe(x));
    
    // Start button click handler
    b.onclick=()=>{
      a=1;
      b.classList.add('hidden');
      const v=s[0].querySelector('video');
      v.currentTime=0;
      
      const playPromise=v.play();
      if(playPromise!==undefined){
        playPromise.catch(()=>{
          // Retry after short delay
          setTimeout(()=>v.play().catch(()=>{}),100);
        });
      }
      
      let d=0;
      const c=()=>{
        if(d||!v.duration||v.duration-v.currentTime>0.2||scrolling)return;
        d=1;
        if(s[1]){
          scrolling=1;
          if('scrollIntoView'in s[1]){
            s[1].scrollIntoView({behavior:'smooth',block:'start'});
          }else{
            s[1].scrollIntoView();
          }
          setTimeout(()=>scrolling=0,1000);
        }
        v.removeEventListener('timeupdate',c);
      };
      v.addEventListener('timeupdate',c);
    };
    
    // Prevent scroll during video transitions
    let lastScroll=0;
    window.addEventListener('scroll',()=>{
      const now=Date.now();
      if(scrolling&&now-lastScroll<1000){
        return;
      }
      lastScroll=now;
    },{passive:true});
    
    // Ensure videos are ready on mobile
    document.addEventListener('DOMContentLoaded',()=>{
      s.forEach(section=>{
        const v=section.querySelector('video');
        if(v){
          v.load();
        }
      });
    });
  </script>
</body>
</html>
